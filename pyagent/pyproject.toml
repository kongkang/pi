[project]
name = "pyagent"
version = "0.1.0"
description = "Pi 编排器：以 pi (RPC) 为 Agent 引擎，统一管理 ~/Developer 下多项目的开发会话"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "lark-oapi>=1.7.1",
]

[project.scripts]
pyagent = "pyagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent"]
